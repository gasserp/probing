name: pages

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pages/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: gasserp/probing-data
          ref: main
          path: probing-data
      - name: Build static artifact
        run: |
          set -eu
          test -f probing-data/data/rollups/hourly.json
          test -f probing-data/data/rollups/yearly.json
          mkdir -p _site/data
          cp pages/index.html pages/styles.css pages/app.js _site/
          cp probing-data/data/rollups/*.json _site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
