name: pages

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pages/**"
      - "denylist/**"
      - "geoip/**"
      - "ingest/**"
      - "cmd/probing-deny-list/**"
      - "cmd/probing-insights/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: gasserp/probing-data
          ref: main
          path: probing-data
      - name: Build static artifact
        run: |
          set -eu
          test -f probing-data/data/rollups/hourly.json
          test -f probing-data/data/rollups/yearly.json
          mkdir -p _site/data
          cp pages/index.html pages/styles.css pages/app.js pages/world.json _site/
          cp probing-data/data/rollups/*.json _site/data/
          # Version the script and stylesheet URLs so a browser never pairs a
          # cached copy from an earlier deploy with the new page.
          version="${GITHUB_SHA:0:12}"
          sed -i "s/?v=dev\"/?v=$version\"/g" _site/index.html
          test "$(grep -c "?v=$version\"" _site/index.html)" -eq 2
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # DB-IP publishes its free country and ASN databases once a month
      # (CC BY 4.0, attributed in the dashboard footer). Cache them so the
      # hourly build downloads each month's files once. If the new month is
      # not out yet, or the download fails, the previous files are used; with
      # none at all the dashboard publishes without countries and networks.
      - name: Resolve geolocation month
        id: geoip-month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      # Kept outside the source tree: geoip/ is the Go package.
      - uses: actions/cache/restore@v4
        with:
          path: .dbip
          key: dbip-lite-v2-${{ steps.geoip-month.outputs.month }}
          restore-keys: dbip-lite-v2-
      - name: Fetch geolocation databases
        id: geoip
        continue-on-error: true
        env:
          MONTH: ${{ steps.geoip-month.outputs.month }}
        run: |
          set -eu
          mkdir -p .dbip
          if [ -s ".dbip/dbip-country-lite-$MONTH.csv.gz" ] && [ -s ".dbip/dbip-asn-lite-$MONTH.csv.gz" ]; then
            echo "DB-IP Lite $MONTH restored from cache"
            exit 0
          fi
          mkdir -p .dbip-new
          for name in country asn; do
            curl -fsSL --retry 3 --max-time 300 \
              -o ".dbip-new/dbip-$name-lite-$MONTH.csv.gz" \
              "https://download.db-ip.com/free/dbip-$name-lite-$MONTH.csv.gz"
            gzip -t ".dbip-new/dbip-$name-lite-$MONTH.csv.gz"
          done
          rm -rf .dbip
          mv .dbip-new .dbip
          echo "downloaded=true" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@v4
        if: steps.geoip.outputs.downloaded == 'true'
        with:
          path: .dbip
          key: dbip-lite-v2-${{ steps.geoip-month.outputs.month }}
      - name: Build dashboard insights
        run: |
          set -eu
          set --
          country="$(ls .dbip/dbip-country-lite-*.csv.gz 2>/dev/null | tail -n 1 || true)"
          asn="$(ls .dbip/dbip-asn-lite-*.csv.gz 2>/dev/null | tail -n 1 || true)"
          if [ -n "$country" ]; then set -- "$@" -country-db "$country"; fi
          if [ -n "$asn" ]; then set -- "$@" -asn-db "$asn"; fi
          go run ./cmd/probing-insights \
            -repo probing-data \
            -repository gasserp/probing-data \
            -output _site/data/insights.json \
            "$@"
      - name: Build deny lists
        run: |
          go run ./cmd/probing-deny-list \
            -repo probing-data \
            -repository gasserp/probing-data \
            -output _site/deny-list
      - name: Check that firewalls accept the deny lists
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq nftables ipset
          sudo unshare --net sh -eu -c '
            for list in recent persistent; do
              nft -f "_site/deny-list/$list.nft"
              nft -f "_site/deny-list/$list.nft"
              ipset restore -exist < "_site/deny-list/$list.ipset"
            done
          '
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
