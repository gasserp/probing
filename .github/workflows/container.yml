name: container

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate container isolation
        env:
          PROBING_STORAGE_ACCOUNT: probingvalidation
          PROBING_STORAGE_CONTAINER: pending-batches
        run: docker compose -f deploy/docker-compose.yml config --format json | python3 deploy/validate-compose.py
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: probing-collector
          push: true
          tags: ghcr.io/gasserp/probing:main
          platforms: linux/amd64,linux/arm64
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: probing-uploader
          push: true
          tags: ghcr.io/gasserp/probing:uploader-main
          platforms: linux/amd64,linux/arm64
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: probing-file-adapter
          push: true
          tags: ghcr.io/gasserp/probing:adapter-main
          platforms: linux/amd64,linux/arm64
