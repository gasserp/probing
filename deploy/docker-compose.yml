services:
  ingress:
    image: haproxy:3.2-alpine@sha256:6343ce34a132a5dceaa24767d739df2bd519f8f7c1079ae39e4821334e8eb42e
    restart: unless-stopped
    user: "99:99"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "22:2222"
      - "80:8080"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - public
      - decoy
    depends_on:
      - cowrie
      - nginx

  collector:
    image: ${PROBING_IMAGE:-ghcr.io/gasserp/probing:main}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["-config", "/etc/probing/config.json"]
    user: "65532:65532"
    read_only: true
    network_mode: none
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./config.json:/etc/probing/config.json:ro
      - /var/lib/probing:/data
      - nginx-logs:/logs/nginx:ro
      - cowrie-var:/logs/cowrie:ro

  nginx:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/health | grep -qx ok"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    tmpfs:
      - /var/cache/nginx
      - /var/run
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-logs:/var/log/nginx/probing
    networks:
      - decoy

  cowrie:
    image: cowrie/cowrie:3.0.13@sha256:42e01e0e5fe705a0a63dacc0f1992b2d230740ac149af7675f48197abf740d44
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./cowrie.cfg:/cowrie/cowrie-git/etc/cowrie.cfg:ro
      - cowrie-etc:/cowrie/cowrie-git/etc
      - cowrie-var:/cowrie/cowrie-git/var
    networks:
      - decoy

networks:
  public:
  decoy:
    internal: true

volumes:
  nginx-logs:
  cowrie-etc:
  cowrie-var:
