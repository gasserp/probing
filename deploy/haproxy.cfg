global
    log stdout format raw local0
    maxconn 256

defaults
    log global
    mode tcp
    timeout connect 5s
    timeout client 2m
    timeout server 2m

frontend ssh
    bind 0.0.0.0:22
    bind :::22 v6only
    default_backend cowrie

backend cowrie
    server cowrie 172.30.0.2:2222 send-proxy

frontend http
    bind 0.0.0.0:80
    bind :::80 v6only
    default_backend nginx

backend nginx
    server nginx 172.30.0.3:8080 send-proxy
