global
    log stdout format raw local0
    maxconn 256

defaults
    log global
    mode tcp
    timeout connect 5s
    timeout client 2m
    timeout server 2m

frontend ssh
    bind :2222
    default_backend cowrie

backend cowrie
    server cowrie cowrie:2222 check send-proxy

frontend http
    bind :8080
    default_backend nginx

backend nginx
    server nginx nginx:8080 check send-proxy
