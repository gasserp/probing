# Host sensor: publishes failed logins against this machine's real OpenSSH
# server, read from the systemd journal. Unlike ../docker-compose.yml there
# is no decoy and no published port; sshd runs on the host, not in Docker.
#
# install.sh writes /etc/probing/config.json, the uploader credential, and .env
# next to this file, then builds and starts the stack.
name: probing-openssh

services:
  collector:
    image: ${PROBING_IMAGE:-ghcr.io/gasserp/probing:main}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: probing-collector
    restart: unless-stopped
    command: ["-config", "/etc/probing/config.json"]
    user: "65532:65532"
    read_only: true
    network_mode: none
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - /etc/probing/config.json:/etc/probing/config.json:ro
      - /var/lib/probing:/data
      - /var/lib/probing/outbox:/outbox
      - /var/lib/probing/ipc/openssh:/ipc/openssh:ro
    depends_on:
      - openssh-adapter

  openssh-adapter:
    image: ${PROBING_JOURNAL_ADAPTER_IMAGE:-ghcr.io/gasserp/probing:journal-adapter-main}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: probing-journal-adapter
    restart: unless-stopped
    command:
      - "-directory"
      - "/journal"
      - "-unit"
      - "${PROBING_SSH_UNIT:-ssh.service}"
      - "-socket"
      - "/ipc/adapter.sock"
    user: "65533:65532"
    # The host's systemd-journal group, which may read journal files. The
    # adapter still sees only the sshd unit's records; journalctl filters on
    # the _SYSTEMD_UNIT field that journald itself sets.
    group_add:
      - "${PROBING_JOURNAL_GID:?set PROBING_JOURNAL_GID}"
    read_only: true
    network_mode: none
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - /var/log/journal:/journal:ro
      - /var/lib/probing/ipc/openssh:/ipc

  uploader:
    image: ${PROBING_UPLOADER_IMAGE:-ghcr.io/gasserp/probing:uploader-main}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: probing-uploader
    restart: unless-stopped
    # Exactly one target: the contributor's own public GitHub repository
    # (PROBING_GITHUB_REPOSITORY), or the maintainer's Azure Blob container
    # with an Entra service principal. install.sh leaves the other empty.
    command:
      - "-github-repository"
      - "${PROBING_GITHUB_REPOSITORY:-}"
      - "-account"
      - "${PROBING_STORAGE_ACCOUNT:-}"
      - "-container"
      - "${PROBING_STORAGE_CONTAINER:-}"
      - "-tenant-id"
      - "${PROBING_AZURE_TENANT_ID:-}"
      - "-client-id"
      - "${PROBING_AZURE_CLIENT_ID:-}"
      - "-credential-file"
      - "/secrets/upload-credential"
      - "-outbox"
      - "/outbox"
    user: "65532:65532"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - /var/lib/probing/outbox:/outbox
      - /etc/probing/upload-credential:/secrets/upload-credential:ro
    networks:
      - upload

networks:
  upload: {}
