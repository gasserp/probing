#cloud-config
package_update: true
bootcmd:
  - [systemctl, mask, --now, ssh.service, ssh.socket]

packages:
  - curl
  - git

runcmd:
  - |
    set -eu
    if [ ! -d /opt/probing/.git ]; then
      git clone --no-checkout https://github.com/gasserp/probing.git /opt/probing
    fi
    git -C /opt/probing fetch --depth 1 origin __PROBING_REPOSITORY_REF__
    git -C /opt/probing checkout --detach FETCH_HEAD
    /opt/probing/infra/migrate-v2.sh \
      --storage-account __STORAGE_ACCOUNT_NAME__ \
      --storage-container __STORAGE_CONTAINER_NAME__ \
      --repository-ref __PROBING_REPOSITORY_REF__
